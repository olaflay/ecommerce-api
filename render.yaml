services:
  # 1. Backend REST API (Web Service)
  - type: web
    name: ecommerce-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://ecommerce-consumer.onrender.com,http://localhost:5173
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"

  # 2. Frontend Consumer Client (Static Site)
  - type: web
    name: ecommerce-consumer
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd consumer && npm install && npm run build
    staticPublishPath: ./consumer/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ecommerce-api.onrender.com

databases:
  # 3. Managed PostgreSQL Database
  - name: ecommerce-postgres
    plan: free
    region: oregon
    databaseName: ecommerce_db
    user: ecommerce_user
